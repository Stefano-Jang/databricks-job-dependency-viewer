# The main job for jiig.
# All three tasks read native system tables only — no auxiliary notebooks needed.
resources:
  jobs:
    jiig_job:
      name: ${var.account_name}_jiig_job

      parameters:
        - name: workspace_id
          default: ${var.workspace_id}
        - name: failure_lookback_days
          default: ${var.failure_lookback_days}
        - name: lineage_lookback_days
          default: ${var.lineage_lookback_days}
        - name: impact_max_depth
          default: ${var.impact_max_depth}
        - name: jiig_dag_table
          default: ${var.jiig_dag_table}
        - name: dashboard_table
          default: ${var.dashboard_table}
        - name: lineage_edge_table
          default: ${var.lineage_edge_table}
        - name: max_table_fanout
          default: ${var.max_table_fanout}
        - name: include_consumer_kinds
          default: ${var.include_consumer_kinds}

      schedule:
        quartz_cron_expression: 0 0/30 * * * ?
        timezone_id: UTC

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:
        - task_key: jiig_lineage_edges
          sql_task:
            file:
              path: ../src/job/jiig-lineage-edges.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: jiig_dag_table
          sql_task:
            file:
              path: ../src/job/jiig-dag-table-creation.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          depends_on:
            - task_key: jiig_lineage_edges

        - task_key: jiig_dashboard_table
          sql_task:
            file:
              path: ../src/job/jiig-dashboard-table-creation.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          depends_on:
            - task_key: jiig_lineage_edges
