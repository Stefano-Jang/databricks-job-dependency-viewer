resources:
  apps:
    job_dependency_graph:
      name: 'jiig-streamlit-${bundle.target}'
      description: 'Lakeflow incident blast-radius and dependency intelligence'
      source_code_path: ../src/apps
      resources:
        - name: jiig_warehouse
          description: SQL warehouse for JIIG app queries
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
      user_api_scopes: ['sql', 'catalog.tables:read', 'catalog.schemas:read', 'catalog.catalogs:read']
      config:
        command: ['python', 'run_app.py']
        env:
          - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
            value: 'false'
          - name: STREAMLIT_SERVER_ENABLE_CORS
            value: 'false'
          - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
            value: 'false'
          - name: DAG_TABLE_NAME
            value: ${var.jiig_dag_table}
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: FAILURE_LOOKBACK_DAYS
            value: ${var.failure_lookback_days}
          - name: IMPACT_MAX_DEPTH
            value: ${var.impact_max_depth}
