# This is a Databricks asset bundle definition for jiig.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: jiig
  uuid: 2cc4ebc9-744c-422b-b6ba-864288ec70c0

variables:
  # The "warehouse_id" variable is used to reference the warehouse used by the dashboard.
  warehouse_id:
    lookup:
      # Replace this with the name of your SQL warehouse.
      warehouse: dbdemos-shared-endpoint
  workspace_id:
    description: workspace id
    default: 1444828305810485
  account_name:
    description: Customer Name
    default: MyCompany
  jiig_catalog:
    description: Base catalog
    default: shared
  jiig_schema:
    # Per-target schema keeps dev/prod isolated and lets the dashboard reference
    # tables by bare name (resolved via dataset_catalog/dataset_schema at deploy).
    description: Base schema (per deployment target)
    default: stefano_jiig_${bundle.target}
  failure_lookback_days:
    description: Failures within this window (days) are analyzed
    default: 7
  lineage_lookback_days:
    description: Table lineage within this window (days) defines dependency edges
    default: 30
  impact_max_depth:
    description: Maximum number of downstream hops to follow for impact analysis
    default: 5
  jiig_dag_table:
    description: Table for network node and edge information
    default: ${var.jiig_catalog}.${var.jiig_schema}.dag_relationships
  dashboard_table:
    # The bare table name (jiig_dashboard) is hardcoded in the dashboard dataset
    # query; catalog/schema are injected via dataset_catalog/dataset_schema.
    description: Table for dashboard information
    default: ${var.jiig_catalog}.${var.jiig_schema}.jiig_dashboard

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      root_path: /Workspace/Users/stefano.jang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: '[DEV-JIIG-${workspace.current_user.short_name}]'
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
      source_linked_deployment: false
      tags:
        project: jiig
        creator: databricks
        environment: dev

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/stefano.jang@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/stefano.jang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: '[PRD-JIIG]'
      pipelines_development: false
      trigger_pause_status: UNPAUSED
      jobs_max_concurrent_runs: 1
      source_linked_deployment: false
      tags:
        project: jiig
        creator: databricks
        environment: prd
    permissions:
      - user_name: stefano.jang@databricks.com
        level: CAN_MANAGE
