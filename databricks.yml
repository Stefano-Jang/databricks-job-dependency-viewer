# This is a Databricks asset bundle definition for jiig.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: jiig
  uuid: 2cc4ebc9-744c-422b-b6ba-864288ec70c0

variables:
  # The SQL warehouse that runs the job tasks, the dashboard and the app.
  # REQUIRED: set this to a warehouse that exists in your workspace. The name is
  # resolved to an id at deploy time, so a wrong name fails the deploy with a
  # lookup error rather than failing silently later.
  #   databricks warehouses list --profile <your-profile>
  warehouse_id:
    lookup:
      warehouse: your-sql-warehouse-name
  # REQUIRED: every system-table query filters on this. It must be the numeric
  # id of the workspace you are analyzing -- a wrong value returns zero rows
  # instead of an error, which looks like "no failures" rather than a
  # misconfiguration. Find it in the workspace URL (?o=<workspace_id>) or via
  # `databricks current-user me` -> workspace host, then Admin Settings.
  workspace_id:
    description: Numeric workspace id used to filter all system tables
    default: "0000000000000000"
  account_name:
    description: Customer Name
    default: MyCompany
  jiig_catalog:
    description: Base catalog
    default: shared
  jiig_schema:
    # Per-target schema keeps dev/prod isolated and lets the dashboard reference
    # tables by bare name (resolved via dataset_catalog/dataset_schema at deploy).
    description: Base schema (per deployment target)
    default: jiig_${bundle.target}
  failure_lookback_days:
    description: Failures within this window (days) are analyzed
    default: 7
  lineage_lookback_days:
    description: Table lineage within this window (days) defines dependency edges
    default: 30
  impact_max_depth:
    description: Maximum number of downstream hops to follow for impact analysis
    default: 5
  jiig_dag_table:
    description: Table for network node and edge information
    default: ${var.jiig_catalog}.${var.jiig_schema}.dag_relationships
  dashboard_table:
    # The bare table name (jiig_dashboard) is hardcoded in the dashboard dataset
    # query; catalog/schema are injected via dataset_catalog/dataset_schema.
    description: Table for dashboard information
    default: ${var.jiig_catalog}.${var.jiig_schema}.jiig_dashboard
  lineage_edge_table:
    description: Shared dependency edge table (single source of truth for edges)
    default: ${var.jiig_catalog}.${var.jiig_schema}.lineage_edges
  max_table_fanout:
    description: |
      A table written by more than this many distinct producers is treated as a shared sink,
      not a dependency. On a large demo workspace, hub tables (platform monitoring sinks plus
      user scratch tables) inflated the edge set from ~8k to ~873k via a writers x readers
      cartesian product. Capping at 20 excluded only 46 tables.
    default: 20
  include_consumer_kinds:
    description: Extra downstream consumer kinds beyond JOB/PIPELINE (e.g. DASHBOARD,QUERY,GENIE,ALERT). These are read-only leaves that consume tables but never produce them.
    default: DASHBOARD,QUERY,GENIE,ALERT

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      root_path: /Workspace/Users/stefano.jang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: '[DEV-JIIG-${workspace.current_user.short_name}]'
      pipelines_development: true
      trigger_pause_status: PAUSED
      jobs_max_concurrent_runs: 1
      source_linked_deployment: false
      tags:
        project: jiig
        creator: databricks
        environment: dev

  prod:
    mode: production
    workspace:
      host: https://e2-demo-field-eng.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/stefano.jang@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/stefano.jang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    presets:
      name_prefix: '[PRD-JIIG]'
      pipelines_development: false
      trigger_pause_status: UNPAUSED
      jobs_max_concurrent_runs: 1
      source_linked_deployment: false
      tags:
        project: jiig
        creator: databricks
        environment: prd
    permissions:
      - user_name: stefano.jang@databricks.com
        level: CAN_MANAGE
