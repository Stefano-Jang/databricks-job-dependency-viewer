# When deployed with DABs, resources/jiig.apps.yml provides the full config
# (command + env) from bundle variables — this file is not used.
# For manual (non-bundle) deployments, uncomment the env section below and
# fill in your values; the app fails fast with a clear error when they are
# missing.
command: [
  "streamlit",
  "run",
  "app.py"
]

env:
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
